# 테스트 클래스패스에서는 이 파일이 src/main/resources/application.properties를 대신한다.
# 두 파일이 합쳐지지 않으므로 테스트에 필요한 설정을 모두 여기에 적는다.
spring.application.name=payment-playground

# SQLite 인메모리 DB는 커넥션마다 다른 DB가 되므로 파일 DB를 쓴다.
# build/test-db 디렉터리는 Gradle test 태스크가 실행 전에 비우고 다시 만든다.
spring.datasource.url=jdbc:sqlite:./build/test-db/payment-playground.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
